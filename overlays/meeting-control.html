<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Control</title>
<!-- Control panel for the meeting overlays. Add it to OBS as a dock:
     Docks → Custom Browser Docks… → Name "Meeting Control", URL = file:///…/overlays/meeting-control.html
     (obs/build_meetings.py --install adds it for you). Changes show in the overlays within ½ s. -->
<script src="config.js"></script>
<script src="../brands/private/brands.js"></script>
<script src="../state/meeting-remote.js"></script>
<script src="shared.js"></script>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html, body { overflow: auto; }
  body { background: var(--ink); padding: 14px 14px 24px; font-size: 14px; }
  h1 { font-size: 13px; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  h1::before { content: ""; width: 24px; height: 1px; background: currentColor; }
  section { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--paper) 10%, transparent); }
  h2 { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--paper); background: color-mix(in srgb, var(--paper) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--paper) 16%, transparent); border-radius: var(--radius); padding: 7px 9px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; padding: 6px 11px; border-radius: var(--radius);
    color: var(--paper); background: color-mix(in srgb, var(--paper) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--paper) 16%, transparent);
  }
  button:hover { border-color: var(--accent); }
  button.primary { color: var(--ink); background: var(--accent); border-color: var(--accent); }
  .presets { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .presets button { text-align: left; font-weight: 400; }
  .presets button.on { border-color: var(--accent); color: var(--accent); }
  .now { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 1.2em; }
  .now b { color: var(--accent); font-weight: 400; font-family: var(--mono); }
  .status { font-size: 11px; color: var(--muted); }
  .status .ok { color: #7ddc8a; } .status .bad { color: #ff8a7a; }
  #brandRow button.on { color: var(--ink); background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <h1 class="label">Meeting control</h1>

  <section id="brandSec" hidden>
    <h2 class="label">Brand</h2>
    <div class="row" id="brandRow"></div>
  </section>

  <section id="calSec">
    <h2 class="label">Calendar autopilot</h2>
    <label style="display:flex;gap:8px;align-items:center;cursor:pointer">
      <input type="checkbox" id="autopilot" style="width:auto"> Use my calendar for title, countdown &amp; agenda
    </label>
    <div class="now" id="calStatus">Checking calendar…</div>
    <div class="now" id="calNext"></div>
    <div class="row"><button id="useInvite" hidden>Use invite agenda</button></div>
  </section>

  <section>
    <h2 class="label">Meeting title</h2>
    <input id="title" placeholder="Weekly sync">
  </section>

  <section>
    <h2 class="label">Agenda bar</h2>
    <input id="agenda" placeholder="Now discussing…">
    <div class="row">
      <button class="primary" id="agendaSet">Show</button>
      <button id="agendaClear">Clear</button>
      <button id="agendaNext">Next item →</button>
    </div>
    <h2 class="label" style="margin-top:12px">Items (one per line, click to show)</h2>
    <textarea id="items" placeholder="Intros&#10;Roadmap review&#10;Open questions"></textarea>
    <div class="presets" id="presets"></div>
  </section>

  <section>
    <h2 class="label">Starting soon</h2>
    <div class="row">
      <button data-start="1">1 min</button><button data-start="3">3 min</button>
      <button data-start="5">5 min</button><button data-start="10">10 min</button>
    </div>
    <div class="row"><input id="startAt" type="time" style="width:auto"><button id="startAtSet">Start at</button></div>
    <div class="now" id="startNow"></div>
  </section>

  <section>
    <h2 class="label">Be right back</h2>
    <input id="brbNote" placeholder="Grabbing a coffee">
    <div class="row">
      <button data-brb="2">2 min</button><button data-brb="5">5 min</button>
      <button data-brb="10">10 min</button><button data-brb="15">15 min</button>
    </div>
    <div class="now" id="brbNow"></div>
  </section>

  <section id="phoneSec" hidden>
    <h2 class="label">Phone remote</h2>
    <div class="now">Scan with your phone (same Wi-Fi). Anyone with this link can control your overlays, so don't share it.</div>
    <div id="qr" style="background:#fff;padding:10px;border-radius:8px;width:max-content;margin-top:8px"></div>
    <div class="now" id="phoneUrl" style="word-break:break-all;user-select:all"></div>
  </section>

  <section>
    <div class="status" id="status">Looking for overlays…</div>
  </section>

<script>
  const $ = (id) => document.getElementById(id);

  // Brand picker (only when brands/private/brands.js exists). Every overlay reloads in the new brand.
  const brandList = Object.entries(window.OBSKIT_BRANDS || {}).filter(([, b]) => !b.hiddenInPicker);
  if (brandList.length) {
    $("brandSec").hidden = false;
    [["", { label: "Personal" }], ...brandList].forEach(([id, b]) => {
      const btn = document.createElement("button");
      btn.textContent = b.label || id;
      btn.classList.toggle("on", id === CFG.brandId);
      btn.onclick = () => { try { localStorage.setItem("obsKit.brand", id); } catch (e) {} writeMeeting({ brand: id }); };
      $("brandRow").appendChild(btn);
    });
  }
  const st0 = readMeeting();
  $("title").value = st0.title ?? CFG.meetingTitle ?? "";
  $("agenda").value = st0.agenda ?? CFG.agenda ?? "";
  $("brbNote").value = st0.brbNote ?? CFG.brbNote ?? "";
  try { $("items").value = localStorage.getItem("obsKit.items") || ""; } catch (e) {}

  // Text fields apply as you type (title, BRB note) or on Show (agenda)
  // Calendar: which meeting are dock changes for? (autopilot leaves values set for it alone)
  let cal = calendarNow();
  const evId = () => (meetingView(readMeeting(), cal).event || {}).id || "";
  const setAgenda = (text) => writeMeeting({ agenda: text, agendaFor: evId() });
  $("title").addEventListener("input", (e) => writeMeeting({ title: e.target.value, titleFor: evId() }));
  $("brbNote").addEventListener("input", (e) => writeMeeting({ brbNote: e.target.value }));
  $("agendaSet").onclick = () => setAgenda($("agenda").value);
  $("agenda").addEventListener("keydown", (e) => { if (e.key === "Enter") $("agendaSet").click(); });
  $("agendaClear").onclick = () => { $("agenda").value = ""; setAgenda(""); };

  // Agenda items
  // "Intros (5m)" → "Intros": the minutes are for autopilot timing, not for the bar
  const items = () => $("items").value.split("\n").map((s) => s.replace(/\s*\(\d+\s*m(?:in)?\)\s*$/i, "").trim()).filter(Boolean);
  function renderPresets() {
    const cur = readMeeting().agenda || "";
    $("presets").innerHTML = "";
    items().forEach((it, i) => {
      const b = document.createElement("button");
      b.textContent = (i + 1) + " · " + it;
      b.classList.toggle("on", cur === b.textContent);
      b.onclick = () => { $("agenda").value = b.textContent; setAgenda(b.textContent); renderPresets(); };
      $("presets").appendChild(b);
    });
  }
  // Share the item list with the phone remote (debounced while typing)
  let itemsTimer = null;
  const shareItems = () => { clearTimeout(itemsTimer); itemsTimer = setTimeout(() => writeMeeting({ items: items() }), 600); };
  $("items").addEventListener("input", () => { try { localStorage.setItem("obsKit.items", $("items").value); } catch (e) {} renderPresets(); shareItems(); });
  $("agendaNext").onclick = () => {
    const list = items(); if (!list.length) return;
    const labels = list.map((it, i) => (i + 1) + " · " + it);
    const i = labels.indexOf(readMeeting().agenda || "");
    const next = labels[(i + 1) % labels.length];
    $("agenda").value = next; setAgenda(next); renderPresets();
  };
  renderPresets();

  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const inviteLines = (ev) => (ev && ev.agenda || []).map((i) => i.text + (i.minutes ? " (" + i.minutes + "m)" : "")).join("\n");
  let lastAuto = { id: null, items: "" };
  $("autopilot").checked = readMeeting().autopilot !== false;
  $("autopilot").onchange = (e) => writeMeeting({ autopilot: e.target.checked });
  $("useInvite").onclick = () => {
    const ev = meetingView(readMeeting(), cal).event;
    $("items").value = inviteLines(ev); $("items").dispatchEvent(new Event("input"));
  };
  function renderCal() {
    // No calendar data (autopilot not set up): keep the dock uncluttered
    $("calSec").hidden = cal.status === "missing";
    const v = meetingView(readMeeting(), cal), now = Date.now();
    const st = cal.status === "ok" && !cal.stale ? '<span style="color:#7ddc8a">● Connected</span>'
      : cal.status === "ok" ? '<span style="color:#ffc46b">● Last update ' + Math.round((now - cal.generated) / 60e3) + ' min ago</span> — is OBS open?'
      : cal.status === "denied" ? '<span style="color:#ff8a7a">● No calendar access</span> — System Settings → Privacy &amp; Security → Calendars → ObsKit Calendar'
      : '<span style="color:#ff8a7a">● Not set up</span> — run tools/calendar/build.sh --run';
    $("calStatus").innerHTML = st + (cal.status === "ok" ? " · " + cal.events.length + " meeting" + (cal.events.length === 1 ? "" : "s") + " in the next 24 h" : "");
    const ev = cal.current || cal.next;
    $("calNext").textContent = !ev ? "No more meetings today."
      : (ev === cal.current ? "Now: " : "Next: ") + ev.title + " · " + fmtTime(ev.start) + "–" + fmtTime(ev.end)
        + (ev.platform ? " · " + ev.platform[0].toUpperCase() + ev.platform.slice(1) : "")
        + (ev.agenda && ev.agenda.length ? " · " + ev.agenda.length + " agenda items" : "");
    $("useInvite").hidden = !(v.event && v.event.agenda && v.event.agenda.length);
    // New meeting coming up: load its agenda into the item list (unless you've typed your own)
    if (v.autopilot && v.event && v.event.id !== lastAuto.id) {
      const cur = $("items").value.trim();
      if (!cur || cur === lastAuto.items) {
        const lines = inviteLines(v.event);
        if (lines) { $("items").value = lines; $("items").dispatchEvent(new Event("input")); }
        lastAuto = { id: v.event.id, items: lines };
      } else lastAuto.id = v.event.id;
      if (readMeeting().titleFor !== v.event.id) { $("title").value = ""; }
    }
    $("title").placeholder = v.title || "Weekly sync";
  }
  watchCalendar((c) => { cal = c; renderCal(); });

  // Phone remote: show the secret link as a QR code while tools/remote/server.py is running
  let shownUrl = "", serverUp = false;
  async function renderPhone() {
    try {
      const r = await fetch("http://127.0.0.1:" + (CFG.remotePort || 8777) + "/local/info", { cache: "no-store" });
      const { url } = await r.json();
      $("phoneSec").hidden = false; serverUp = true;
      if (url !== shownUrl) {
        shownUrl = url; $("phoneUrl").textContent = url; $("qr").textContent = "";
        if (window.QRCode) new QRCode($("qr"), { text: url, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M });
        else $("qr").hidden = true;                       // offline: the link text still works
        writeMeeting({ items: items() });                 // give the phone the current item list
      }
    } catch (e) { $("phoneSec").hidden = true; shownUrl = ""; serverUp = false; }
  }
  renderPhone(); setInterval(renderPhone, 5000);
  setInterval(renderCal, 5000);

  // Timers
  document.querySelectorAll("[data-start]").forEach((b) =>
    b.onclick = () => writeMeeting({ countdownTo: Date.now() + b.dataset.start * 60e3 }));
  $("startAtSet").onclick = () => {
    const [h, m] = ($("startAt").value || "").split(":").map(Number);
    if (isNaN(h)) return;
    const t = new Date(); t.setHours(h, m || 0, 0, 0);
    if (t < Date.now() - 60e3) t.setDate(t.getDate() + 1);
    writeMeeting({ countdownTo: t.getTime() });
  };
  document.querySelectorAll("[data-brb]").forEach((b) =>
    b.onclick = () => writeMeeting({ brbUntil: Date.now() + b.dataset.brb * 60e3, brbNote: $("brbNote").value }));

  // Live readouts + heartbeat + which overlays are reachable
  setInterval(() => {
    const s = readMeeting(), now = Date.now();
    $("startNow").innerHTML = s.countdownTo > now ? "Starts in <b>" + fmtClock(s.countdownTo - now) + "</b>" : "";
    $("brbNow").innerHTML = s.brbUntil > now ? "Back in <b>" + fmtClock(s.brbUntil - now) + "</b>" : "";
    // In OBS the dock and overlays can't share browser storage, so changes reach the overlays
    // through the remote server (tools/remote/server.py, started by OBS for Meetings).
    $("status").innerHTML = serverUp
      ? '<span class="ok">● Connected</span> — overlays and phone update through the local server'
      : '<span class="bad">● Server not running</span> — overlays in OBS won\'t follow this dock. Turn on "Phone remote" in Tools → Scripts → startup-scene.lua';
  }, 1000);
</script>
</body>
</html>
