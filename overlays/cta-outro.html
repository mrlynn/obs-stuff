<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CTA Outro</title>
<!-- End-of-video "follow" card. Works on 16:9 or 9:16 Browser Sources. -->
<script src="config.js"></script>
<script src="../brands/private/brands.js"></script>
<script src="shared.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: grid; place-items: center; }
  .card {
    text-align: center;
    padding: 1.1em 1.6em 1.2em;
    font-size: clamp(18px, 2.2vmax, 40px);
    border-radius: var(--radius);
    background: var(--ink);
    border: 1px solid color-mix(in srgb, var(--paper) 14%, transparent);
    box-shadow: .7em .7em 0 -1px var(--ink), .7em .7em 0 0 var(--accent), 0 30px 80px rgba(0,0,0,.45);
    transform: translateY(30px) scale(.92);
    opacity: 0;
  }
  .avatar {
    width: 2.4em; height: 2.4em;
    margin: 0 auto .8em;
    border-radius: var(--radius);
    background: var(--accent);
    display: grid; place-items: center;
    font-size: 1.3em;
  }
  .avatar span {
    width: 1.35em; height: 1.35em; border-radius: 50%;
    background: var(--ink); color: var(--accent);
    display: grid; place-items: center;
    font-weight: 700; font-size: .75em;
  }
  .avatar.brand { width: auto; height: 1.6em; background: none; padding: 0 .2em; font-size: 1.3em; }
  .cta    { font-size: 2.3em; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
  .handle { margin-top: .6em; font-size: .9em; color: var(--accent); }
  .sub    { margin-top: .6em; font-size: 1em; color: var(--muted); }
  .btn {
    margin-top: 1em;
    display: inline-flex; align-items: center; gap: .5em;
    padding: .55em 1.3em;
    border-radius: var(--radius);
    font-weight: 600;
    color: var(--ink);
    background: var(--accent);
  }
  .show { transition: all .7s var(--ease-out); transform: none; opacity: 1; }
  .show .btn { animation: pulse 1.6s 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 0 0 .4em color-mix(in srgb, var(--accent) 22%, transparent); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="avatar"><span id="initials"></span></div>
    <div class="cta" data-cfg="cta"></div>
    <div class="handle label" data-cfg="handle"></div>
    <div class="sub" data-cfg="ctaSub"></div>
    <div class="btn">Follow →</div>
  </div>
<script>
  if (CFG.brandId) {
    const av = document.querySelector(".avatar"); av.classList.add("brand"); brandMark(av);
  } else {
    document.getElementById("initials").textContent =
      String(CFG.name || "?").trim()[0].toUpperCase();   // single letter, like the site's "M" mark
  }
  const card = document.getElementById("card");
  onObsShow((v) => (card.className = "card" + (v ? " show" : "")));
</script>
</body>
</html>
