<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBS Remote">
<meta name="theme-color" content="#131512">
<title>OBS Remote</title>
<!-- Served by tools/remote/server.py at a secret link. Self-contained: no external files. -->
<style>
  :root {
    --bg: #131512; --card: #1d1f1b; --line: rgba(232,230,220,.12); --fg: #E8E6DC; --muted: #A9A79D;
    --accent: #E8C547; --ink: #131512; --ok: #7ddc8a; --bad: #ff8a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font: 16px/1.35 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.ok { background: var(--ok); }
  .live { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-weight: 600; color: var(--fg); background: rgba(232,230,220,.06);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; min-height: 52px; cursor: pointer;
  }
  button:active { transform: scale(.98); }
  button.on { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  button.wide { width: 100%; }
  .scene { text-align: left; padding: 14px 12px; }
  .scene small { display: block; font-weight: 400; opacity: .7; font-size: 12px; margin-top: 2px; }
  .now { color: var(--muted); font-size: 14px; margin: 2px 0 10px; min-height: 1.3em; }
  .now b { color: var(--fg); font-weight: 600; }
  .items { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .items button { text-align: left; font-weight: 400; min-height: 46px; }
  input { width: 100%; font: inherit; color: var(--fg); background: rgba(232,230,220,.06); border: 1px solid var(--line);
          border-radius: 12px; padding: 13px 12px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .err { color: var(--bad); font-size: 14px; display: none; margin-bottom: 12px; }
  .err.show { display: block; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); translate: -50% 0;
           background: var(--accent); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 999px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="live" id="live">Connecting…</span>
    <span class="clock" id="clock"></span>
  </header>
  <div class="err" id="err">Can't reach your Mac. Is OBS open, and is this phone on the same Wi-Fi?</div>

  <section>
    <h2>Scene</h2>
    <div class="grid" id="scenes"></div>
  </section>

  <section>
    <h2>Be right back</h2>
    <div class="now" id="brbNow"></div>
    <div class="row">
      <button data-brb="2">2 min</button><button data-brb="5">5 min</button>
      <button data-brb="10">10 min</button><button data-brb="15">15 min</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="wide" id="back">I'm back</button></div>
  </section>

  <section>
    <h2>Agenda</h2>
    <div class="now" id="agendaNow"></div>
    <div class="row"><button id="next">Next item →</button><button id="clear">Clear</button></div>
    <div class="items" id="items"></div>
  </section>

  <section>
    <h2>Starting soon</h2>
    <div class="now" id="startNow"></div>
    <div class="row"><button data-start="1">1 min</button><button data-start="3">3 min</button><button data-start="5">5 min</button></div>
  </section>

  <section>
    <h2>Meeting title</h2>
    <div class="row"><input id="title" placeholder="Weekly sync" enterkeyhint="done"></div>
  </section>

  <section>
    <div class="row"><button class="wide" id="refresh">Refresh overlays</button></div>
  </section>

  <div class="toast" id="toast"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let state = {}, obs = { scenes: [], scene: "" }, offset = 0;
  const now = () => Date.now() + offset;                 // Mac clock, so timers match the overlays
  const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1400); };
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} };

  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  const setState = async (patch) => { buzz(); try { state = (await post("state", patch)).state; render(); } catch (e) { fail(); } };
  const setScene = async (name) => { if (!name) return; buzz(); try { await post("scene", { scene: name }); obs.scene = name; render(); toast("→ " + name.replace(/^M\d · /, "")); } catch (e) { fail(); } };
  const findScene = (re) => (obs.scenes || []).find((s) => re.test(s)) || "";

  $("refresh").onclick = async () => { await setState({ reload: now() }); toast("Overlays refreshing"); };

  function fail() { $("dot").classList.remove("ok"); $("err").classList.add("show"); }

  async function poll() {
    try {
      const r = await fetch("state", { cache: "no-store" });
      const d = await r.json();
      offset = d.now - Date.now();
      state = d.state || {}; obs = d.obs || obs;
      $("dot").classList.add("ok"); $("err").classList.remove("show");
      render();
    } catch (e) { fail(); }
  }

  function render() {
    const stale = !obs.at || now() - obs.at > 10000;
    $("live").textContent = stale ? "OBS not responding" : "Live: " + (obs.scene || "—").replace(/^M\d · /, "");
    $("clock").textContent = new Date(now()).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    // Scenes (helpers like "[nested] …" are hidden)
    const names = (obs.scenes || []).filter((s) => !s.startsWith("["));
    const box = $("scenes");
    if (box.dataset.names !== names.join("|")) {
      box.dataset.names = names.join("|"); box.textContent = "";
      names.forEach((n, i) => {
        const b = document.createElement("button"); b.className = "scene";
        b.textContent = n.replace(/^M\d · /, "");
        const s = document.createElement("small"); s.textContent = "⌃⌥" + (i + 1); b.appendChild(s);
        b.onclick = () => setScene(n); b.dataset.scene = n; box.appendChild(b);
      });
    }
    box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.scene === obs.scene));

    // Timers
    const t = now();
    $("brbNow").innerHTML = state.brbUntil > t ? "Back in <b>" + fmt(state.brbUntil - t) + "</b>" + (state.brbNote ? " · " + escapeHtml(state.brbNote) : "") : "";
    $("startNow").innerHTML = state.countdownTo > t ? "Starts in <b>" + fmt(state.countdownTo - t) + "</b>" : "";

    // Agenda
    $("agendaNow").innerHTML = state.agenda ? "Showing <b>" + escapeHtml(state.agenda) + "</b>" : "Agenda bar hidden";
    const items = Array.isArray(state.items) ? state.items : [];
    const list = $("items");
    if (list.dataset.items !== items.join("|")) {
      list.dataset.items = items.join("|"); list.textContent = "";
      items.forEach((it, i) => {
        const b = document.createElement("button"); b.textContent = (i + 1) + " · " + it;
        b.onclick = () => setState({ agenda: b.textContent, agendaFor: state.agendaFor || "" }); list.appendChild(b);
      });
      if (!items.length) { const p = document.createElement("div"); p.className = "now"; p.textContent = "Add agenda items in the Meeting Control dock."; list.appendChild(p); }
    }
    list.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.textContent === state.agenda));
    if (document.activeElement !== $("title")) $("title").value = state.title || "";
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Controls
  document.querySelectorAll("[data-brb]").forEach((b) => b.onclick = async () => {
    await setState({ brbUntil: now() + b.dataset.brb * 60e3 });
    setScene(findScene(/be right back|brb/i));
  });
  $("back").onclick = async () => { await setState({ brbUntil: 0 }); setScene(findScene(/cam/i) || (obs.scenes || [])[0]); };
  document.querySelectorAll("[data-start]").forEach((b) => b.onclick = async () => {
    await setState({ countdownTo: now() + b.dataset.start * 60e3 });
    setScene(findScene(/starting soon/i));
  });
  $("next").onclick = () => {
    const items = (state.items || []).map((it, i) => (i + 1) + " · " + it);
    if (!items.length) return;
    const i = items.indexOf(state.agenda || "");
    setState({ agenda: items[(i + 1) % items.length], agendaFor: state.agendaFor || "" });
  };
  $("clear").onclick = () => setState({ agenda: "", agendaFor: state.agendaFor || "" });
  $("title").addEventListener("change", (e) => setState({ title: e.target.value, titleFor: state.titleFor || "" }));
  $("title").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });

  poll(); setInterval(poll, 1500); setInterval(render, 1000);
</script>
</body>
</html>
