<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Social Preview</title>
<!-- Source for docs/social-preview.png (GitHub social preview, 1280×640).
     Re-render from the repo root:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --allow-file-access-from-files --window-size=1280,640 --virtual-time-budget=4000 \
         --screenshot=docs/social-preview.png "file://$PWD/docs/social-preview.html"
     Colors and fonts come from overlays/config.js, same as the overlays. -->
<script src="../overlays/config.js"></script>
<script src="../overlays/shared.js"></script>
<link rel="stylesheet" href="../overlays/shared.css">
<style>
  html, body { width: 1280px; height: 640px; }
  body { background: var(--ink); position: relative; }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
          background: var(--accent); filter: blur(160px); opacity: .16; right: -260px; top: -380px; }
  .grid { position: absolute; inset: 0; opacity: .05;
          background-image: linear-gradient(var(--paper) 1px, transparent 1px), linear-gradient(90deg, var(--paper) 1px, transparent 1px);
          background-size: 64px 64px;
          -webkit-mask: radial-gradient(ellipse at 70% 40%, #000 10%, transparent 70%); }

  /* Left: text (kept inside GitHub's ~40px safe border) */
  .copy { position: absolute; left: 72px; top: 92px; width: 560px; }
  .eyebrow { display: flex; align-items: center; gap: 16px; font-size: 15px; color: var(--accent); }
  .eyebrow::before { content: ""; width: 44px; height: 1px; background: currentColor; }
  h1 { margin-top: 28px; font-size: 92px; font-weight: 700; line-height: .95; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: var(--accent); }
  .tag { margin-top: 26px; font-size: 26px; font-style: italic; color: var(--accent); }
  .sub { margin-top: 18px; font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 520px; }
  .foot { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
  .foot b { color: var(--paper); font-weight: 400; }

  /* Right: overlay previews */
  .tile { position: absolute; overflow: hidden; border-radius: var(--radius);
          background: linear-gradient(135deg, #3a4150, #1d2230 60%, #2b2f3a);
          border: 1px solid color-mix(in srgb, var(--paper) 14%, transparent);
          box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  .tile iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
  .wide  { left: 668px; top: 132px; width: 448px; height: 252px; }
  .wide iframe  { width: 1920px; height: 1080px; transform: scale(.2333); }
  .phone { left: 1010px; top: 236px; width: 198px; height: 352px;
           box-shadow: 14px 14px 0 -1px var(--ink), 14px 14px 0 0 var(--accent), 0 30px 70px rgba(0,0,0,.55); }
  .phone iframe { width: 1080px; height: 1920px; transform: scale(.1833); }
  .card  { left: 668px; top: 410px; width: 300px; height: 169px; }
  .card iframe  { width: 1920px; height: 1080px; transform: scale(.15625); }
  .ratio { position: absolute; top: 10px; left: 12px; font-size: 11px; color: var(--accent);
           background: color-mix(in srgb, var(--ink) 85%, transparent); padding: 4px 8px; border-radius: var(--radius); z-index: 2; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="copy">
    <div class="eyebrow label">OBS Studio · Social video kit</div>
    <h1>obs-<em>stuff</em></h1>
    <div class="tag">Record once. Post everywhere.</div>
    <div class="sub">Brandable overlays, a ready-made scene collection, and ffmpeg scripts that cut 9:16, 4:5, 1:1 and 16:9 from one recording.</div>
  </div>
  <div class="foot label"><span><b>github.com/</b>mrlynn/obs-stuff</span><span><b>mlynn.org</b></span></div>

  <div class="tile wide"><span class="ratio label">16:9</span><iframe src="../overlays/lower-third.html#lowerThirdHoldSeconds=0"></iframe></div>
  <div class="tile card"><span class="ratio label">Outro</span><iframe src="../overlays/cta-outro.html"></iframe></div>
  <div class="tile phone"><span class="ratio label">9:16</span><iframe src="../overlays/hook-title.html"></iframe></div>
</body>
</html>
